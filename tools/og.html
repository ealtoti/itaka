<!doctype html>
<!-- Fonte para gerar assets/img/og-image.png (1200x630). Veja tools/render-images.js -->
<html><head><meta charset="utf-8">

<style>
  @font-face{font-family:"Space Grotesk";font-weight:700;src:url(sg700.ttf)}
  @font-face{font-family:Inter;font-weight:500;src:url(inter500.ttf)}
  html,body{margin:0}
  body{width:1200px;height:630px;background:#16120F;color:#F4EEE6;font-family:"Space Grotesk",sans-serif;position:relative;overflow:hidden}
  .glow{position:absolute;left:50%;bottom:-360px;width:1100px;height:600px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,90,31,.22),rgba(255,90,31,0))}
  .wrap{position:absolute;left:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
  img{width:430px}
  h1{font-size:64px;letter-spacing:-.03em;line-height:1.05;margin:44px 0 0;max-width:900px}
  p{font-family:Inter,sans-serif;font-weight:500;font-size:26px;color:#A89F97;margin:18px 0 0}
  .dot{position:absolute;border-radius:50%}
</style></head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <img src="../assets/img/logo-light.svg" alt="">
    <h1>O fogo que torna possível.</h1>
    <p>Tecnologia para lives, mídia e games.</p>
  </div>
  <script>
    // brasas estáticas, posições fixas para o resultado ser sempre igual
    var pts=[[980,120,3,'#FFB020'],[1050,210,2,'#FF5A1F'],[900,300,2.5,'#FF5A1F'],[1120,360,2,'#FFB020'],[1010,440,3,'#FF5A1F'],[860,500,2,'#FFB020'],[1100,540,2.5,'#FF5A1F'],[940,190,1.5,'#FFB020'],[800,420,1.5,'#FF5A1F'],[1150,90,1.5,'#FF5A1F']];
    pts.forEach(function(p){var d=document.createElement('span');d.className='dot';d.style.cssText='left:'+p[0]+'px;top:'+p[1]+'px;width:'+p[2]*2+'px;height:'+p[2]*2+'px;background:'+p[3]+';opacity:.8';document.body.appendChild(d);});
  </script>
</body></html>
